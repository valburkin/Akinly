      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="268" r="150" fill="#FFFFFF" fill-opacity="0.12"/>
  <path d="M 388.4 197.6 A 150 150 0 1 1 326.4 135.6" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <circle cx="204" cy="298" r="30" fill="#FFFFFF"/>
