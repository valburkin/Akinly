# Weekly updates for every pinned dependency, each at least five days old, so a release
# pulled soon after publishing never arrives. Minor and patch releases arrive as one pull
# request per ecosystem.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Current connectors are built against VectorData.Abstractions 10.1.0 and fail against 10.5.0
      # and later (docs/design.md); move it by hand once they catch up.
      - dependency-name: Microsoft.Extensions.VectorData.Abstractions

  # The SDK in global.json. It stays on the line of the target framework (net10.0, an LTS
  # release); a new major SDK is a deliberate change, made by hand.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
